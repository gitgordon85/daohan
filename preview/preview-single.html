/* === style.css (项目主样式) === */
/* 自定义滚动条 */
:root {
  --card-padding: 1.25rem; /* 20px, default p-5 */
  --card-radius: 0.75rem;  /* 12px, default rounded-xl */
  --frosted-glass-blur: 15px; /* Default blur */
}

.home-title-block:empty {
  display: none;
}

/* 粘性页脚：内容不足一屏时推到底部，内容较多时自然跟随文档流 */
#app-scroll > .main-content {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

#app-scroll > .main-content > header,
#app-scroll > .main-content > div,

/* ========================================= */
/*  Theme Switch Animation (View Transitions)*/
/* ========================================= */
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}

/* 仅在主题切换时应用自定义动画 */
.theme-animating::view-transition-group(root) {
  animation-duration: 0.5s;
}

.theme-animating::view-transition-old(root) {
  z-index: 1;
}

/* 默认：从上往下 (Dark Mode 出现) */
.theme-animating.dark::view-transition-new(root) {
  z-index: 999;
  animation: theme-wipe-down 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

/* 反向：从下往上 (Light Mode 出现) */
.theme-animating:not(.dark)::view-transition-new(root) {
  z-index: 999;
  animation: theme-wipe-up 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes theme-wipe-down {
  from {
    clip-path: inset(0 0 100% 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

@keyframes theme-wipe-up {
  from {
    clip-path: inset(100% 0 0 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #c3d0e3;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #416d9d;
}

/* Dark Mode Scrollbar */
.dark ::-webkit-scrollbar-track {
  background: transparent;
}
.dark ::-webkit-scrollbar-thumb {
  background: #4b5563;
}
.dark ::-webkit-scrollbar-thumb:hover {
  background: #6b7280;
}

/* ========================================= */
/*  Dark Mode & Wallpaper Optimizations      */
/* ========================================= */

/* 1. 背景压暗 (仅在有壁纸且夜间模式时) */
html.dark body.custom-wallpaper::before {
    content: '';
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6); /* 60% 黑色遮罩 */
    z-index: -1;
    pointer-events: none;
    transition: background-color 0.3s ease;
}

/* 2. 侧边栏深色玻璃化 */
html.dark body.custom-wallpaper .sidebar {
    background-color: rgba(17, 24, 39, 0.85) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
}

/* 3. 卡片基础与悬停样式 */
.site-card {
  transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
              box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
              background-color 0.3s ease,
              border-color 0.3s ease,
              color 0.3s ease;
  will-change: auto;
  container-type: inline-size; /* 开启容器查询，允许子元素监听卡片宽度 */
  container-name: card;
  border-radius: var(--card-radius) !important;
  width: 100%;
  height: 100%; /* 撑满 Grid 单元高度 */
  display: flex;
  flex-direction: column;
  backface-visibility: hidden;
  transform: translateZ(0);
  contain: content; /* 关键：隔离卡片内部渲染，防止大量图片加载或颜色改变引发全局重绘 */
}

.site-card:hover {
  will-change: transform;
  transform: scale(1.05) translateY(-4px);
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
  z-index: 30;
  border: 2px solid #416d9d !important;
}

.site-card-content {
  padding: var(--card-padding);
  flex: 1; /* 占据卡片所有垂直空间 */
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

.site-card-content a {
    /* flex: 1; Removed to compact height */
    display: flex;
    flex-direction: column;
}

/* 让描述部分撑开，确保底部链接行对齐 */
.site-card p, .site-card .preview-desc {
    /* flex: 1; Removed to reduce height */
    margin-bottom: 0;
    /* 强制两行高度: line-height (relaxed=1.625) * 2 lines * font-size (sm=0.875rem) ≈ 2.85rem */
    height: 2.85rem;
}

/* 夜间模式卡片 - 仅在开启毛玻璃时应用半透明 */
.dark .site-card.frosted-glass-effect {
    background-color: rgba(30, 41, 59, 0.4) !important;
    backdrop-filter: blur(var(--frosted-glass-blur, 15px));
    -webkit-backdrop-filter: blur(var(--frosted-glass-blur, 15px));
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
}

/* 确保实色模式下也有边框颜色 */
.dark .site-card:not(.frosted-glass-effect) {
    border-color: rgba(255, 255, 255, 0.05);
}

.dark .site-card:hover {
  border-color: rgba(255, 255, 255, 0.3) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

.dark .site-card-content h3 {
    color: #f3f4f6 !important;
}

.dark .site-card-content p {
    color: #9ca3af !important;
}

/* 文字颜色过渡 */
.site-title, 
.site-card p, 
.site-card-content span,
.site-card-content a,
.nav-btn,
.search-engine-option {
  /* 优化：指定特定属性，减少主题切换时的计算量 */
  transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
}

.dark .site-card-content .text-primary-600 {

/* 复制提示 */
@keyframes fadeInOut {
  0% { opacity: 0; transform: translateY(10px); }
  20% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-10px); }
}
.copy-success-animation { animation: fadeInOut 2s ease forwards; }

/* 动态隐藏复制文字：当卡片自身宽度不足时 */
@container card (max-width: 250px) {
  .copy-text {
    display: none !important;
  }
  .copy-btn svg {
    margin-right: 0 !important;
  }
  .copy-btn {
    padding: 0.25rem !important;
  }
}

.copy-btn {
  white-space: nowrap !important; /* 强制文字不换行 */
  flex-shrink: 0 !important;    /* 禁止按钮被压缩 */
}

@media (max-width: 440px) {
  /* 隐藏“复制”文字，保留图标 */
  .copy-text {
    display: none !important;
  }
  
  /* 确保按钮依然显示，且移除图标的右边距（因为文字没了） */
  .copy-btn {
    display: inline-flex !important;
    padding: 0.25rem !important;
  }
  
  .copy-btn svg {
    margin-right: 0 !important;
  }
  
  /* 确保链接文本容器能利用剩余空间 */
  .site-card .mt-3.flex.justify-between span.text-xs.truncate {
    max-width: calc(100% - 30px) !important; 
  }
}

/* 卡片加载/切换动画 */
.card-anim-enter {
  opacity: 0;
  animation-name: cardRadialIn;
  animation-duration: 0.6s;
  animation-timing-function: ease-out;
  animation-fill-mode: forwards;
  backface-visibility: hidden;
  transition: none !important;
  will-change: opacity, transform;
}

.card-anim-cleanup {
  transition: none !important;
}

.card-anim-flip-settle {
  position: relative;
}

.card-anim-slideUp { animation-name: cardSlideUpIn; animation-duration: 0.6s; }
.card-anim-radial { animation-name: cardRadialIn; animation-duration: 0.5s; }
.card-anim-fadeIn { animation-name: cardFadeIn; animation-duration: 0.6s; }
.card-anim-slideLeft { animation-name: cardSlideLeftIn; animation-duration: 0.6s; }
.card-anim-slideRight { animation-name: cardSlideRightIn; animation-duration: 0.6s; }
.card-anim-convergeIn { animation-name: cardConvergeIn; animation-duration: 0.7s; }
.card-anim-flipIn {
  animation-name: cardFlipShellIn;
  animation-duration: 0.68s;
  animation-timing-function: cubic-bezier(0.25, 0.6, 0.25, 1);
  perspective: 900px;
  transform-origin: center;
  transform-style: preserve-3d;
  will-change: opacity, transform;
  position: relative;
}

.site-card.card-anim-flipIn.frosted-glass-effect {
  animation-name: cardFrostedFlipShellIn;
  background: rgba(255, 255, 255, 0.4) !important;
  border: 1px solid rgba(255, 255, 255, 0.6) !important;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05) !important;
  backdrop-filter: blur(var(--frosted-glass-blur, 15px)) !important;
  -webkit-backdrop-filter: blur(var(--frosted-glass-blur, 15px)) !important;
}

.card-anim-flipIn::before {
  content: none;
}

.card-anim-flip-settle::before {
  content: none;
}

.dark .site-card.card-anim-flipIn.frosted-glass-effect {
  background: rgba(30, 41, 59, 0.4) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3) !important;
  backdrop-filter: blur(var(--frosted-glass-blur, 15px)) !important;
  -webkit-backdrop-filter: blur(var(--frosted-glass-blur, 15px)) !important;
}

.card-anim-flipIn .site-card-content {
  backface-visibility: hidden;
  transform-origin: center;
}

.card-anim-flipIn.frosted-glass-effect .site-card-content {
  animation: none;
  will-change: auto;
}

@keyframes cardSlideUpIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardRadialIn {
  0% { opacity: 0; transform: scale(0.3); }
  50% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardSlideLeftIn {
  from { opacity: 0; transform: translateX(-50px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes cardSlideRightIn {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes cardConvergeIn {
  from {
    opacity: 0;
    transform: translate(var(--card-anim-x, 0), var(--card-anim-y, -28px));
  }
  to { opacity: 1; transform: translate(0, 0); }
}

@keyframes cardFlipShellIn {
  0% { opacity: 0; transform: perspective(900px) rotateY(-82deg); }
  30% { opacity: 0.6; transform: perspective(900px) rotateY(-45deg); }
  55% { opacity: 0.86; transform: perspective(900px) rotateY(-24deg); }
  75% { opacity: 1; transform: perspective(900px) rotateY(-11deg); }
  90% { opacity: 1; transform: perspective(900px) rotateY(-4deg); }
  100% { opacity: 1; transform: perspective(900px) rotateY(0deg); }
}

@keyframes cardFrostedFlipShellIn {
  0% { opacity: 0; transform: perspective(900px) rotateY(-82deg); }
  16% { opacity: 1; transform: perspective(900px) rotateY(-82deg); }
  34% { opacity: 1; transform: perspective(900px) rotateY(-45deg); }
  58% { opacity: 1; transform: perspective(900px) rotateY(-24deg); }
  78% { opacity: 1; transform: perspective(900px) rotateY(-11deg); }
  92% { opacity: 1; transform: perspective(900px) rotateY(-4deg); }
  100% { opacity: 1; transform: perspective(900px) rotateY(0deg); }
}

@media (prefers-reduced-motion: reduce) {
  .card-anim-enter {
    animation: none !important;
    opacity: 1;
    transform: none;
  }
}

/* === home-ui.js === */
(function () {
  const Home = window.IoriHome = window.IoriHome || {};

  function initSidebar() {
    const sidebar = document.getElementById('sidebar');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const closeSidebar = document.getElementById('closeSidebar');

    function openSidebar() {
      sidebar?.classList.add('open');
      mobileOverlay?.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebarMenu() {
      sidebar?.classList.remove('open');
      mobileOverlay?.classList.remove('open');
      document.body.style.overflow = '';
    }

    sidebarToggle?.addEventListener('click', openSidebar);
    closeSidebar?.addEventListener('click', closeSidebarMenu);
    mobileOverlay?.addEventListener('click', closeSidebarMenu);

    return { closeSidebarMenu };
  }

  function showCopySuccess(btn) {
    const successMsg = btn.querySelector('.copy-success');
    if (!successMsg) return;
    successMsg.classList.remove('hidden');
    successMsg.classList.add('copy-success-animation');
    setTimeout(() => {
      successMsg.classList.add('hidden');
      successMsg.classList.remove('copy-success-animation');
    }, 2000);
  }

  function initCopyButtons() {
    const sitesGrid = document.getElementById('sitesGrid');

    sitesGrid?.addEventListener('click', function (e) {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;

      e.preventDefault();
      e.stopPropagation();
      const url = btn.getAttribute('data-url');
      if (!url) return;

      navigator.clipboard.writeText(url).then(() => {
        showCopySuccess(btn);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.style.position = 'fixed';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showCopySuccess(btn);
        } catch (err) {
          alert('复制失败,请手动复制');
        }
        document.body.removeChild(textarea);
      });
    });
  }

  function initBackToTop() {
    const backToTop = document.getElementById('backToTop');
    const appScroll = document.getElementById('app-scroll');

    let scrollTicking = false;
    const onScroll = () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => {
        const top = appScroll ? appScroll.scrollTop : window.pageYOffset;
        if (top > 300) {
          backToTop?.classList.remove('opacity-0', 'invisible');
        } else {
          backToTop?.classList.add('opacity-0', 'invisible');
        }
        scrollTicking = false;
      });
    };

    if (appScroll) {
      appScroll.addEventListener('scroll', onScroll);
    } else {
      window.addEventListener('scroll', onScroll);
    }

    backToTop?.addEventListener('click', function () {
      if (appScroll) {
        appScroll.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'fixed top-4 right-4 bg-accent-500 text-white px-4 py-2 rounded shadow-lg z-50 transition-opacity duration-300';
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  function initHitokoto() {
    const hitokotoContainer = document.querySelector('#hitokoto')?.parentElement;
    if (!hitokotoContainer || hitokotoContainer.classList.contains('hidden')) return;

    /* mock: */ Promise.resolve({json:()=>Promise.resolve({hitokoto: window.__MOCK_DATA__.hitokoto, uuid:'mock'})})
      .then(res => res.json())
      .then(data => {
        const hitokoto = document.getElementById('hitokoto_text');
        if (hitokoto) {
          hitokoto.href = `https://hitokoto.cn/?uuid=${data.uuid}`;
          hitokoto.innerText = data.hitokoto;
        }
      })
      .catch(console.error);
  }

  function initThemeToggle() {
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (!themeToggleBtn) return;

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      const nextState = isDark ? 'light' : 'dark';

      const updateTheme = () => {
        if (nextState === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', nextState);
      };

      if (!document.startViewTransition) {
        updateTheme();
        return;
      }

      document.documentElement.classList.add('theme-animating');

      const transition = document.startViewTransition(() => {
        updateTheme();
      });

      transition.finished.finally(() => {
        document.documentElement.classList.remove('theme-animating');
      });
    });
  }

  Home.initCommonUi = function () {
    const sidebarController = initSidebar();
    Home.closeSidebarMenu = sidebarController.closeSidebarMenu;
    Home.showToast = showToast;

    initCopyButtons();
    initBackToTop();
    initHitokoto();
    initThemeToggle();
  };
})();

  </script>

/* === home-cards.js === */
(function () {
  const Home = window.IoriHome = window.IoriHome || {};

  Home.createCardController = function () {
    const initialCards = document.querySelectorAll('.site-card.card-anim-enter');
    const sitesGrid = document.getElementById('sitesGrid');
    const defaultCardConfig = {
      hideDesc: false,
      hideLinks: false,
      hideCategory: false,
      hideCopyText: false,
      enableFrostedGlass: false,
      cardStyle: 'style1',
      cardAnimation: 'radial',
      gridCols: '4',
      aboveFoldImageCount: 8,
      baseCardClass: 'site-card group h-full flex flex-col bg-white border border-primary-100/60 shadow-sm overflow-hidden dark:bg-gray-800 dark:border-gray-700',
      frostedClass: '',
      cardStyleClass: '',
      titleClass: 'site-title text-base font-medium text-gray-900 dark:text-gray-100 truncate transition-all duration-300 origin-left',
      descClass: 'mt-2 text-sm text-gray-600 dark:text-gray-400 leading-relaxed line-clamp-2',
      categoryClass: 'site-category inline-flex items-center px-2 py-0.5 mt-1 rounded-full text-xs font-medium bg-secondary-100 text-primary-700 dark:bg-secondary-800 dark:text-primary-300',
      linkRowClass: 'mt-3 flex items-center justify-between',
      urlTextClass: 'text-xs text-primary-600 dark:text-primary-400 truncate flex-1 min-w-0 mr-2',
      copyButtonBaseClass: 'copy-btn relative flex items-center px-2 py-1 rounded-full text-xs font-medium transition-colors',
      copyButtonEnabledClass: 'bg-accent-100 text-accent-700 hover:bg-accent-200 dark:bg-accent-900/30 dark:text-accent-300 dark:hover:bg-accent-900/50',
      copyButtonDisabledClass: 'bg-gray-200 text-gray-400 cursor-not-allowed dark:bg-gray-700 dark:text-gray-500',
      logoClass: 'w-10 h-10 rounded-lg object-cover bg-gray-100 dark:bg-gray-700',
      siteIconClass: 'site-icon flex-shrink-0 mr-4 transition-all duration-300',
    };
    const cardConfigSets = window.IORI_CARD_CONFIGS || {
      desktop: window.IORI_CARD_CONFIG || defaultCardConfig,
      mobile: window.IORI_CARD_CONFIG || defaultCardConfig,
    };
    const cardAnimationTypes = ['slideUp', 'radial', 'fadeIn', 'slideLeft', 'slideRight', 'convergeIn', 'flipIn'];
    const cardAnimationClasses = cardAnimationTypes.map(type => `card-anim-${type}`);
    const reducedMotionQuery = window.matchMedia?.('(prefers-reduced-motion: reduce)');
    const mobileCardQuery = window.matchMedia?.('(max-width: 767px)');
    let activeCardDevice = '';
    let cardConfig = getActiveCardConfig();
    let activeRenderedCatalogId = window.IORI_LAYOUT_CONFIG?.ssrCatalogId && window.IORI_LAYOUT_CONFIG.ssrCatalogId !== 'all'
      ? String(window.IORI_LAYOUT_CONFIG.ssrCatalogId)
      : null;

    function getCardDevice() {
      return mobileCardQuery?.matches ? 'mobile' : 'desktop';
    }

    function getActiveCardConfig() {
      const device = getCardDevice();
      activeCardDevice = device;
      return cardConfigSets[device] || cardConfigSets.desktop || window.IORI_CARD_CONFIG || defaultCardConfig;
    }

    function getSitesForCatalog(catalogId) {
      const allSites = window.IORI_SITES || [];
      if (!catalogId) return allSites;
      return allSites.filter(site => String(site.catelog_id) === String(catalogId));
    }

    function applyCardGridColumns() {
      if (!sitesGrid || getCardDevice() !== 'mobile') return;
      const cols = String(cardConfig.gridCols || '2');
      const mobileGridClass = cols === '1' ? 'grid-cols-1' : (cols === '3' ? 'grid-cols-3' : 'grid-cols-2');
      const mobileCardStyleClass = cardConfig.cardStyle === 'style3'
        ? 'mobile-card-style3'
        : (cardConfig.cardStyle === 'style2' ? 'mobile-card-style2' : 'mobile-card-style1');
      sitesGrid.classList.remove('grid-cols-1', 'grid-cols-2', 'grid-cols-3');
      sitesGrid.classList.remove('mobile-card-style1', 'mobile-card-style2', 'mobile-card-style3');
      sitesGrid.classList.add(mobileGridClass);
      sitesGrid.classList.add(mobileCardStyleClass);
    }

    function syncCardConfigForViewport(options = {}) {
      const device = getCardDevice();
      const nextConfig = cardConfigSets[device] || cardConfigSets.desktop || defaultCardConfig;
      if (!options.force && device === activeCardDevice && nextConfig === cardConfig) return;

      activeCardDevice = device;
      cardConfig = nextConfig;
      applyCardGridColumns();
      renderSites(getSitesForCatalog(activeRenderedCatalogId));
      Home.reapplyLocalSearchFilter?.();
    }

    function prefersReducedCardMotion() {
      return reducedMotionQuery?.matches === true;
    }

    function resolveCardAnimationName() {
      const configured = cardConfig.cardAnimation || window.IORI_LAYOUT_CONFIG?.cardAnimation || 'radial';
      if (configured === 'random') {
        return cardAnimationTypes[Math.floor(Math.random() * cardAnimationTypes.length)];
      }
      return cardAnimationTypes.includes(configured) ? configured : 'radial';
    }

    function getAnimationColumnCount() {
      const templateColumns = sitesGrid ? window.getComputedStyle(sitesGrid).gridTemplateColumns : '';
      if (templateColumns && templateColumns !== 'none') {
        const renderedCols = templateColumns.trim().split(/\s+/).filter(Boolean).length;
        if (renderedCols > 0) return renderedCols;
      }

      const configuredCols = String(cardConfig.gridCols || window.IORI_LAYOUT_CONFIG?.gridCols || (getCardDevice() === 'mobile' ? '2' : '4'));
      const width = window.innerWidth;
      if (width < 768) {
        const mobileCols = Number(configuredCols);
        return Number.isFinite(mobileCols) && mobileCols > 0 ? mobileCols : 2;
      }
      if (width < 1024) return 3;

      if (getCardDevice() === 'mobile') {
        const mobileCols = Number(configuredCols);
        return Number.isFinite(mobileCols) && mobileCols > 0 ? mobileCols : 2;
      }
      if (configuredCols === '6') return width >= 1200 ? 6 : 5;
      if (configuredCols === '7') return width >= 1280 ? 7 : 5;

      const cols = Number(configuredCols);
      return Number.isFinite(cols) && cols > 0 ? cols : 4;
    }

    function getCardAnimationDelay(index, animationType) {
      const cols = getAnimationColumnCount();
      const row = Math.floor(index / cols);
      const col = index % cols;
      const centerCol = (cols - 1) / 2;
      let delay = 0;

      if (animationType === 'radial') {
        delay = (Math.abs(col - centerCol) + row) * 80;
      } else if (animationType === 'fadeIn') {
        delay = Math.random() * 500;
      } else if (animationType === 'slideLeft') {
        delay = row * 100;
      } else if (animationType === 'slideRight') {
        delay = (row + (cols - col - 1) * 0.02) * 80;
      } else if (animationType === 'convergeIn') {
        const maxDistance = Math.max(centerCol, cols - centerCol - 1);
        delay = (maxDistance - Math.abs(col - centerCol)) * 80;
      } else if (animationType === 'flipIn') {
        delay = (row + col) * 60;
      } else {
        delay = index * 50;
      }

      return Math.min(delay, 1000);
    }

    function prepareCardAnimation(card, index, animationType) {
      const cols = getAnimationColumnCount();
      const col = index % cols;
      const centerCol = (cols - 1) / 2;

      cardAnimationClasses.forEach(className => card.classList.remove(className));
      card.classList.remove('card-anim-flip-settle', 'card-anim-flip-settle-fade');
      card.style.removeProperty('--card-anim-x');
      card.style.removeProperty('--card-anim-y');

      if (animationType === 'convergeIn') {
        const offset = col - centerCol;
        const distance = Math.abs(offset);
        const isCenter = distance <= 0.5;
        const x = isCenter ? 0 : Math.sign(offset) * Math.min(80, 28 + distance * 22);
        const y = isCenter ? -30 : 0;
        card.style.setProperty('--card-anim-x', `${x}px`);
        card.style.setProperty('--card-anim-y', `${y}px`);
      }

      card.classList.add(`card-anim-${animationType}`);

      const delay = getCardAnimationDelay(index, animationType);
      if (delay > 0) {
        card.style.animationDelay = `${delay}ms`;
      } else {
        card.style.removeProperty('animation-delay');
      }
    }

    function cleanupCardAnimation(card) {
      const wasFlipIn = card.classList.contains('card-anim-flipIn');
      card.classList.add('card-anim-cleanup');
      if (wasFlipIn) {
        card.classList.add('card-anim-flip-settle');
      }
      card.classList.remove('card-anim-enter');
      cardAnimationClasses.forEach(className => card.classList.remove(className));
      card.style.removeProperty('--card-anim-x');
      card.style.removeProperty('--card-anim-y');
      card.style.removeProperty('animation-delay');
      window.requestAnimationFrame(() => {
        card.classList.remove('card-anim-cleanup');
        if (!wasFlipIn) return;
        card.classList.add('card-anim-flip-settle-fade');
        window.setTimeout(() => {
          card.classList.remove('card-anim-flip-settle', 'card-anim-flip-settle-fade');
        }, 160);
      });
    }

    function bindCardAnimationCleanup(card) {
      if (prefersReducedCardMotion()) {
        cleanupCardAnimation(card);
        return;
      }

      let isCleaned = false;
      let fallbackTimer = null;

      const cleanup = () => {
        if (isCleaned) return;
        isCleaned = true;
        cleanupCardAnimation(card);
        card.removeEventListener('animationend', handleAnimationEnd);
        if (fallbackTimer) window.clearTimeout(fallbackTimer);
      };

      const handleAnimationEnd = (event) => {
        if (event.target !== card) return;
        cleanup();
      };

      const delayMs = Number.parseFloat(card.style.animationDelay) || 0;
      fallbackTimer = window.setTimeout(cleanup, delayMs + 900);
      card.addEventListener('animationend', handleAnimationEnd);
    }

    function animateCardBatch(cards) {
      const animationType = resolveCardAnimationName();
      cards.forEach((card, index) => prepareCardAnimation(card, index, animationType));
    }

    function renderSites(sites) {
      if (!sitesGrid) return;

      applyCardGridColumns();
      Home.clearSearchCardCache?.();

      sitesGrid.innerHTML = '';

      if (sites.length === 0) {
        sitesGrid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">本分类下暂无书签</div>';
        return;
      }

      const animationType = resolveCardAnimationName();

      sites.forEach((site, index) => {
        const isAboveFold = index < (cardConfig.aboveFoldImageCount || 8);
        const imgLoadingAttrs = isAboveFold ? 'fetchpriority="high" decoding="async"' : 'loading="lazy" decoding="async"';
        const logoHtml = site.logoUrlHtml
          ? `<img src="${site.logoUrlHtml}" alt="${site.nameHtml}" width="40" height="40" class="${cardConfig.logoClass}" ${imgLoadingAttrs}>`
          : `<div class="w-10 h-10 rounded-lg bg-primary-600 flex items-center justify-center text-white font-semibold text-lg shadow-inner">${site.cardInitialHtml}</div>`;

        const descHtml = cardConfig.hideDesc ? '' : `<p class="${cardConfig.descClass}" title="${site.descHtml}">${site.descHtml}</p>`;

        const linksHtml = cardConfig.hideLinks ? '' : `
          <div class="${cardConfig.linkRowClass}">
            <span class="${cardConfig.urlTextClass}" title="${site.displayUrlHtml}">${site.displayUrlHtml}</span>
            <button class="${cardConfig.copyButtonBaseClass} ${site.hasValidUrl ? cardConfig.copyButtonEnabledClass : cardConfig.copyButtonDisabledClass}" data-url="${site.urlHtml}" ${site.hasValidUrl ? '' : 'disabled'}>
              <svg class="h-3 w-3 ${cardConfig.hideCopyText ? '' : 'mr-1'}"><use href="#icon-copy"/></svg>
              ${cardConfig.hideCopyText ? '' : '<span class="copy-text">复制</span>'}
              <span class="copy-success hidden absolute -top-8 right-0 bg-accent-500 text-white text-xs px-2 py-1 rounded shadow-md">已复制!</span>
            </button>
          </div>`;

        const categoryHtml = cardConfig.hideCategory ? '' : `
                <span class="${cardConfig.categoryClass}">
                  ${site.catalogHtml}
                </span>`;

        const card = document.createElement('div');
        card.className = `${cardConfig.baseCardClass} ${cardConfig.frostedClass} ${cardConfig.cardStyleClass} card-anim-enter`;
        prepareCardAnimation(card, index, animationType);
        bindCardAnimationCleanup(card);

        card.setAttribute('data-id', site.id);

        card.innerHTML = `
        <div class="site-card-content">
          <a href="${site.urlHtml || '#'}" ${site.hasValidUrl ? 'target="_blank" rel="noopener noreferrer"' : ''} class="block">
            <div class="flex items-start">
              <div class="${cardConfig.siteIconClass}">
                ${logoHtml}
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="${cardConfig.titleClass}" title="${site.nameHtml}">${site.nameHtml}</h3>
                ${categoryHtml}
              </div>
            </div>
            ${descHtml}
          </a>
          ${linksHtml}
        </div>
        `;

        sitesGrid.appendChild(card);
      });
    }

    function init() {
      animateCardBatch(initialCards);
      initialCards.forEach((card) => {
        bindCardAnimationCleanup(card);
      });

      mobileCardQuery?.addEventListener('change', () => {
        syncCardConfigForViewport();
      });

      if (getCardDevice() === 'mobile') {
        syncCardConfigForViewport({ force: true });
      }
    }

    return {
      init,
      renderSites,
      getSitesForCatalog,
      setActiveCatalogId(catalogId) {
        activeRenderedCatalogId = catalogId ? String(catalogId) : null;
      },
    };
  };
})();

  <script>
/* === home-category-nav.js === */
(function () {
  const Home = window.IoriHome = window.IoriHome || {};

  Home.initCategoryNavigation = function () {
    const navContainer = document.getElementById('horizontalCategoryNav');
    const moreWrapper = document.getElementById('horizontalMoreWrapper');
    const moreBtn = document.getElementById('horizontalMoreBtn');
    const dropdown = document.getElementById('horizontalMoreDropdown');
    const cardController = Home.cardController;
    let checkOverflow = () => { };
    let resetNav = () => { };

    // moreWrapper 仅在设置「分类展示=单行」时由 SSR 输出；多行模式无此节点，不进入折叠逻辑
    if (navContainer && moreWrapper && moreBtn && dropdown) {
      resetNav = () => {
        const dropdownItems = Array.from(dropdown.children);
        dropdownItems.forEach(item => {
          if (item.dataset.originalClass) item.className = item.dataset.originalClass;
          const link = item.querySelector('a');
          if (link && link.dataset.originalClass) link.className = link.dataset.originalClass;
          navContainer.insertBefore(item, moreWrapper);
        });
        moreWrapper.classList.add('hidden');
        moreBtn.classList.remove('active', 'text-primary-600', 'bg-secondary-100');
        moreBtn.classList.add('inactive');
      };

      const getCategories = () => Array.from(navContainer.children).filter(el => el !== moreWrapper);

      const getVisibleItems = () => Array.from(navContainer.children).filter((el) => {
        if (el === moreWrapper) return !moreWrapper.classList.contains('hidden');
        return true;
      });

      // 单行统一为最多 8 个按钮：根分类（含「全部」）+ 「更多」
      // 有「更多」时根分类最多 7 个；顶部/搜索框上/下位置数量一致
      const MAX_VISIBLE_BUTTONS = 8;
      const MAX_VISIBLE_ROOT_WITH_MORE = MAX_VISIBLE_BUTTONS - 1; // 7

      // 与后台预览 collapseOverflowCategories 一致：按可用宽度折叠
      const measureItemsWidth = () => {
        const styles = window.getComputedStyle(navContainer);
        const gap = parseFloat(styles.columnGap || styles.gap || '0') || 0;
        return getVisibleItems().reduce((total, item, index) => (
          total + item.offsetWidth + (index > 0 ? gap : 0)
        ), 0);
      };

      const needsCollapse = (availableWidth) => {
        const count = getCategories().length;
        // 超过 7 个根分类，或宽度放不下（名称很长/窄屏）
        if (count > MAX_VISIBLE_ROOT_WITH_MORE) return true;
        void navContainer.offsetWidth;
        return measureItemsWidth() > availableWidth;
      };

      const moveCategoryToDropdown = (lastCategory) => {
        if (!lastCategory.dataset.originalClass) {
          lastCategory.dataset.originalClass = lastCategory.className;
        }

        lastCategory.className = 'menu-item-wrapper block w-full relative';

        const link = lastCategory.querySelector('a');
        if (link) {
          link.dataset.originalClass = link.className;
          const isActive = link.classList.contains('active');
          link.className = 'dropdown-item w-full text-left px-4 py-2 text-sm';
          if (isActive) link.classList.add('active');
        }

        dropdown.insertBefore(lastCategory, dropdown.firstChild);
      };

      const restoreCategoryFromDropdown = () => {
        const item = dropdown.firstElementChild;
        if (!item) return null;
        if (item.dataset.originalClass) item.className = item.dataset.originalClass;
        const link = item.querySelector('a');
        if (link && link.dataset.originalClass) link.className = link.dataset.originalClass;
        navContainer.insertBefore(item, moreWrapper);
        return item;
      };

      checkOverflow = () => {
        // 「更多」打开时不要 reset，否则会拆掉弹出层并关菜单
        if (!dropdown.classList.contains('hidden')) return;

        resetNav();
        // 必须 visible，否则多级 hover 下拉与 #horizontalMoreDropdown 会被裁切
        navContainer.style.overflow = 'visible';
        if (navContainer.parentElement) {
          navContainer.parentElement.style.overflow = 'visible';
        }

        const navChildren = getCategories();
        if (navChildren.length === 0) return;

        const availableWidth = navContainer.clientWidth || navContainer.parentElement?.clientWidth || 0;
        // 布局未完成时跳过，后续 ResizeObserver / fonts 会再算
        if (availableWidth < 48) return;

        // 1) 根分类 >7 → 先收到 7 个，保证各位置统一为 7+更多=8
        // 2) 宽度仍不够（≤7 但名称很长/窄屏）→ 继续按宽度收，至少保留 1 个
        void navContainer.offsetWidth;
        if (!needsCollapse(availableWidth)) return;

        moreWrapper.classList.remove('hidden');

        while (getCategories().length > MAX_VISIBLE_ROOT_WITH_MORE) {
          const cats = getCategories();
          moveCategoryToDropdown(cats[cats.length - 1]);
        }

        while (getCategories().length > 1 && measureItemsWidth() > availableWidth) {
          const cats = getCategories();
          moveCategoryToDropdown(cats[cats.length - 1]);
        }

        // 禁止只剩「···」
        if (getCategories().length === 0) {
          restoreCategoryFromDropdown();
        }

        // 折叠区仅剩 1 个分类时直接展示，不为 1 个分类留「···」：
        // 「···」只比一个分类按钮窄约 48px，折叠换不来实际空间
        if (dropdown.children.length === 1) {
          restoreCategoryFromDropdown();
          moreWrapper.classList.add('hidden');
        }

        const activeInDropdown = dropdown.querySelector('.active');
        if (activeInDropdown) {
          moreBtn.classList.add('active');
          moreBtn.classList.remove('inactive');
          moreBtn.classList.add('text-primary-600', 'bg-secondary-100');
        } else {
          moreBtn.classList.remove('active', 'text-primary-600', 'bg-secondary-100');
          moreBtn.classList.add('inactive');
        }
      };

      const scheduleOverflowCheck = () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(checkOverflow, 50);
      };

      // 首屏多次测量：覆盖字体加载与异步布局
      requestAnimationFrame(() => {
        requestAnimationFrame(checkOverflow);
      });
      setTimeout(checkOverflow, 100);
      setTimeout(checkOverflow, 400);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleOverflowCheck).catch(() => {});
      }

      window.addEventListener('resize', scheduleOverflowCheck);
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(scheduleOverflowCheck);
        ro.observe(navContainer);
        if (navContainer.parentElement) ro.observe(navContainer.parentElement);
      }

      moreBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isHidden = dropdown.classList.contains('hidden');
        if (isHidden) {
          dropdown.classList.remove('hidden');
          dropdown.classList.add('show');
          document.body.classList.add('menu-open');
        } else {
          dropdown.classList.add('hidden');
          dropdown.classList.remove('show');
          document.body.classList.remove('menu-open');
        }
      });

      dropdown.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link) {
          dropdown.classList.add('hidden');
          dropdown.classList.remove('show');
          document.body.classList.remove('menu-open');
        }
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && !moreBtn.contains(e.target)) {
          dropdown.classList.add('hidden');
          dropdown.classList.remove('show');
          document.body.classList.remove('menu-open');
        }
      });
    }

    document.addEventListener('click', async (e) => {
      const link = e.target.closest('a[href^="?catalog="]');
      if (!link) return;

      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      e.preventDefault();
      const href = link.getAttribute('href');
      const catalogId = link.getAttribute('data-id');
      const catalogName = link.textContent.trim();

      Home.closeSidebarMenu?.();

      const sitesGrid = document.getElementById('sitesGrid');
      if (!sitesGrid) return;

      sitesGrid.style.transition = 'opacity 0.15s ease-out';
      sitesGrid.style.opacity = '0';

      try {
        if (!window.IORI_SITES || !cardController) {
          window.location.href = href;
          return;
        }

        await new Promise(resolve => setTimeout(resolve, 50));

        sitesGrid.style.transition = 'none';
        sitesGrid.style.opacity = '1';

        const filteredSites = cardController.getSitesForCatalog(catalogId);
        cardController.setActiveCatalogId(catalogId);
        cardController.renderSites(filteredSites);
        Home.updateHeading?.(null, catalogId ? catalogName : null, filteredSites.length);
        updateNavigationState(catalogId);

        const config = window.IORI_LAYOUT_CONFIG || {};
        if (config.rememberLastCategory) {
          if (catalogId) {
            localStorage.setItem('iori_last_category', catalogId);
            setCookie('iori_last_category', catalogId, 365);
          } else {
            localStorage.setItem('iori_last_category', 'all');
            setCookie('iori_last_category', 'all', 365);
          }
        }
      } catch (err) {
        console.error('Client-side navigation failed:', err);
      }
    });

    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
    }

    function updateNavigationState(catalogId) {
      const allLinks = document.querySelectorAll('a.nav-btn, a.dropdown-item');
      allLinks.forEach(link => {
        const linkId = link.getAttribute('data-id');
        const isActive = (!catalogId && !linkId) || (String(linkId) === String(catalogId));

        if (isActive) {
          link.classList.remove('inactive');
          link.classList.add('active', 'nav-item-active');
        } else {
          link.classList.remove('active', 'nav-item-active');
          link.classList.add('inactive');
        }
        link.dataset.originalClass = link.className;
      });

      if (navContainer) {
        const topWrappers = Array.from(navContainer.children);
        topWrappers.forEach(wrapper => {
          const topLink = wrapper.querySelector(':scope > a.nav-btn');
          if (!topLink) return;

          const topLinkId = topLink.getAttribute('data-id');
          if (String(topLinkId) !== String(catalogId)) {
            const subLink = wrapper.querySelector(`a[data-id="${catalogId}"]`);
            if (subLink) {
              topLink.classList.remove('inactive');
              topLink.classList.add('active', 'nav-item-active');
              topLink.dataset.originalClass = topLink.className;
            }
          }
        });
      }

      if (dropdown && moreBtn) {
        const activeInDropdown = dropdown.querySelector('.active');
        if (activeInDropdown) {
          moreBtn.classList.add('active', 'text-primary-600', 'bg-secondary-100');
          moreBtn.classList.remove('inactive');
        } else {
          moreBtn.classList.remove('active', 'text-primary-600', 'bg-secondary-100');
          moreBtn.classList.add('inactive');
        }
      }

      if (!catalogId) {
        const allBtn = document.querySelector('a[href="?catalog=all"]');
        if (allBtn) {
          allBtn.classList.remove('inactive');
          allBtn.classList.add('active', 'nav-item-active');
        }
      }

      const sidebar = document.getElementById('sidebar');
      if (sidebar) {
        const links = sidebar.querySelectorAll('a[data-id], a[href="?catalog=all"]');
        links.forEach(link => {
          const svg = link.querySelector('svg');
          const linkId = link.getAttribute('data-id');
          const isActive = (!catalogId && !linkId) || (String(linkId) === String(catalogId));

          if (isActive) {
            link.classList.remove('hover:bg-gray-100', 'text-gray-700', 'dark:hover:bg-gray-800', 'dark:text-gray-300');
            link.classList.add('bg-secondary-100', 'text-primary-700', 'dark:bg-gray-800', 'dark:text-primary-400');

            if (svg) {
              svg.classList.remove('text-gray-400', 'dark:text-gray-500');
              svg.classList.add('text-primary-600', 'dark:text-primary-400');
            }
          } else {
            link.classList.remove('bg-secondary-100', 'text-primary-700', 'dark:bg-gray-800', 'dark:text-primary-400');
            link.classList.add('hover:bg-gray-100', 'text-gray-700', 'dark:text-gray-300', 'dark:hover:bg-gray-800');

            if (svg) {
              svg.classList.remove('text-primary-600', 'dark:text-primary-400');
              svg.classList.add('text-gray-400', 'dark:text-gray-500');
            }
          }
        });
      }
    }

    function restoreLastCategory() {
      const config = window.IORI_LAYOUT_CONFIG || {};
      const urlParams = new URLSearchParams(window.location.search);
      const hasCatalogParam = urlParams.has('catalog');

      if (!config.rememberLastCategory || hasCatalogParam || !cardController) return;

      let lastId = localStorage.getItem('iori_last_category');

      if (!lastId) {
        const match = document.cookie.match(/iori_last_category=(all|\d+)/);
        if (match) {
          lastId = match[1];
        }
      }

      if (!lastId) return;

      if (String(lastId) === String(config.ssrCatalogId)) {
        return;
      }

      if (lastId === 'all') {
        const allSites = window.IORI_SITES || [];
        cardController.setActiveCatalogId(null);
        cardController.renderSites(allSites);
        Home.updateHeading?.(null, null, allSites.length);
        updateNavigationState(null);
        return;
      }

      const link = document.querySelector(`a[data-id="${lastId}"]`);

      if (link) {
        const catalogName = link.innerText.trim();
        const filteredSites = cardController.getSitesForCatalog(lastId);

        cardController.setActiveCatalogId(lastId);
        cardController.renderSites(filteredSites);
        Home.updateHeading?.(null, catalogName, filteredSites.length);
        updateNavigationState(lastId);
      } else {
        localStorage.removeItem('iori_last_category');
      }
    }

    Home.updateNavigationState = updateNavigationState;
    restoreLastCategory();
  };
})();

    news: '<svg class="h-5 w-5 mr-2 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>',
    tools: '<svg class="h-5 w-5 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/></svg>',
  };
  data.catalogs.forEach(c => {
    const a = document.createElement('a');
    a.href = `?catalog=${c.id}`;
    a.dataset.catalog = c.id;
    a.className = 'catalog-link flex items-center px-3 py-2 rounded-lg w-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors';
    a.innerHTML = (ICONS[c.id] || ICONS.tools) + '<span class="text-gray-700 dark:text-gray-200">' + c.name + '</span>';
    sidebarCat.appendChild(a);
  });

  // 渲染卡片网格
  const grid = document.getElementById('sitesGrid');
  const COLORS = ['from-indigo-400 to-purple-500','from-emerald-400 to-cyan-500','from-blue-400 to-sky-500','from-rose-400 to-pink-500','from-orange-400 to-amber-500','from-violet-400 to-fuchsia-500','from-teal-400 to-emerald-500','from-yellow-400 to-orange-500','from-cyan-400 to-blue-500','from-pink-400 to-rose-500','from-amber-400 to-yellow-500','from-lime-400 to-green-500'];
  data.bookmarks.forEach((b, i) => {
    const initials = (b.name || '?').trim().charAt(0).toUpperCase();
    const color = COLORS[i % COLORS.length];
    let host = '';
    try { host = new URL(b.url).hostname.replace(/^www\./,''); } catch(e) {}
    const card = document.createElement('a');
    card.href = b.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.className = 'card-style group relative bg-white border border-gray-100 rounded-xl p-5 hover:shadow-lg transition-all duration-300 hover:-translate-y-0.5 block';
    card.dataset.catelog = b.catelog || '';
    card.innerHTML = `
      <div class="flex items-start mb-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${color} flex items-center justify-center text-white font-bold mr-3 shrink-0">${initials}</div>
        <div class="min-w-0 flex-1">
          <h3 class="font-semibold text-gray-900 truncate">${b.name}</h3>
          <p class="text-xs text-gray-400 truncate">${host}</p>
        </div>
      </div>
      <p class="text-sm text-gray-500 line-clamp-2">${b.desc || ''}</p>
    `;
    grid.appendChild(card);
  });

  // 同步标题
  const heading = document.querySelector('[data-role="list-heading"]');
  if (heading) heading.textContent = '全部书签';
})();
  </script>
</body>
